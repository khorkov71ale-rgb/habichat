<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HABICHAT</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div class="screens-stack">
      <div id="dashboard" class="screen active" aria-hidden="false"></div>
      <div id="habits" class="screen" aria-hidden="true"></div>
      <div id="social" class="screen" aria-hidden="true"></div>
      <div id="challenges" class="screen" aria-hidden="true"></div>
      <div id="progress" class="screen" aria-hidden="true"></div>
      <div id="premium" class="screen" aria-hidden="true"></div>
    </div>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-screen="dashboard" aria-label="Главная">🏠</button>
      <button class="nav-btn" data-screen="habits" aria-label="Привычки">✅</button>
      <button class="nav-btn" data-screen="social" aria-label="Лента">👥</button>
      <button class="nav-btn" data-screen="challenges" aria-label="Челленджи">🏆</button>
      <button class="nav-btn" data-screen="progress" aria-label="Прогресс">📊</button>
      <button class="nav-btn" data-screen="premium" aria-label="Premium">⭐</button>
    </nav>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="loading" class="loading hidden">Загрузка...</div>

  <script type="module" src="app.js"></script>
</body>
</html>
